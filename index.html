<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分類作業</title>
<style>
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.7;color:#1b1f3b;background:#fff}
  main{max-width:560px;margin:0 auto;padding:18px 16px}
  h1{font-size:24px;color:#1d3f8f}
  .btn{font:inherit;font-weight:700;width:100%;padding:14px;border:0;border-radius:12px;background:#1d3f8f;color:#fff;margin-top:12px}
  .rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rule{border:2px solid #1d3f8f;border-radius:10px;padding:8px;font-weight:700;min-height:64px}
  .rule.r{text-align:right;border-color:#6b3fa0;color:#6b3fa0}
  #stage{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #d5d9ea;border-radius:12px;margin:12px 0}
  #stim{font-size:40px;font-weight:700}
  #err{color:#c2185b;font-weight:700;min-height:30px}
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .side{font:inherit;font-size:22px;font-weight:700;padding:26px 6px;border:0;border-radius:14px;color:#fff;background:#1d3f8f;touch-action:manipulation}
  .side.r{background:#6b3fa0}
  input,textarea{font:inherit;width:100%;padding:8px;border:1px solid #5a6080;border-radius:8px;box-sizing:border-box}
  [hidden]{display:none}
</style>
</head>
<body>
<main>
  <section id="consent">
    <h1 id="title"></h1>
    <p id="consentText"></p>
    <p>受測者代碼（由研究者提供；沒有代碼可以留白）：</p>
    <input id="pid" autocomplete="off">
    <button class="btn" id="agree">我同意參加，開始作答</button>
  </section>
  <section id="brief" hidden>
    <h1 id="bTitle"></h1>
    <p id="bText"></p>
    <div class="rules"><div class="rule" id="bL"></div><div class="rule r" id="bR"></div></div>
    <button class="btn" id="bGo">開始這一段</button>
  </section>
  <section id="play" hidden>
    <div class="rules"><div class="rule" id="pL"></div><div class="rule r" id="pR"></div></div>
    <div id="stage"><div id="stim">＋</div><div id="err"></div></div>
    <div class="sides"><button class="side" id="btnL">左邊</button><button class="side r" id="btnR">右邊</button></div>
  </section>
  <section id="done" hidden>
    <h1>作答完成，謝謝你</h1>
    <p id="doneText"></p>
    <textarea id="csv" rows="8" readonly hidden></textarea>
  </section>
</main>
<script>
// ===== 第一部分：研究者要修改的設定 =====
const CONFIG = {
  title: "分類作業",                                   // 受測者看到的標題，不要寫出測量的構念
  consentText: "這份作業大約需要 5 分鐘。作答內容只用於研究，不會記錄你的姓名。你可以隨時停止。",
  endpoint: "https://script.google.com/macros/s/AKfycbzPDzhfUhRl6-nrGvql6L28jVu4VLn1NbEk1MPnLRoNZnK7cLi20kYZv1FbWteVYTsA/exec",                                         // 貼上 Apps Script 的網址；留空白時，資料會顯示在畫面上
  concept1: { label: "我的公司", items: ["晴海科技", "我們公司", "本公司", "自家公司"] },
  concept2: { label: "其他公司", items: ["別家公司", "其他企業", "外面公司", "同業公司"] },
  attr1:    { label: "愉快",     items: ["快樂", "喜歡", "美好", "舒服"] },
  attr2:    { label: "不愉快",   items: ["痛苦", "討厭", "糟糕", "難受"] },
  trials: [20, 20, 20, 40, 20, 20, 40]                  // 七個區段各自的嘗試次數
};

// ===== 第二部分：程式本身，一般不需要修改 =====
const $ = function (id) { return document.getElementById(id); };
// 隨機決定順序：1 代表先做配對 A，2 代表先做配對 B
const order = Math.random() < 0.5 ? 1 : 2;
// 配對 A：概念 1 與屬性 1 同一個鍵。配對 B：概念 1 與屬性 2 同一個鍵。
const first = order === 1 ? "A" : "B";
const second = order === 1 ? "B" : "A";
// 回傳某一種配對之下，概念在左邊與右邊的安排
function sides(pairing) {
  return pairing === "A" ? { L: "concept1", R: "concept2" } : { L: "concept2", R: "concept1" };
}
// 七個區段的定義：type 是 concept（只分概念）、attr（只分屬性）或 both（合併）
const BLOCKS = [
  { type: "concept", pairing: first,  phase: "single" },
  { type: "attr",    pairing: first,  phase: "single" },
  { type: "both",    pairing: first,  phase: "practice" },
  { type: "both",    pairing: first,  phase: "test" },
  { type: "concept", pairing: second, phase: "single" },
  { type: "both",    pairing: second, phase: "practice" },
  { type: "both",    pairing: second, phase: "test" }
];
let pid = "", bi = 0, list = [], ti = 0, t0 = 0, live = false, firstTry = true;
const records = [];

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function show(id) { ["consent", "brief", "play", "done"].forEach(function (k) { $(k).hidden = k !== id; }); }
// 從兩個類別輪流抽出 n 個刺激
function draw(catA, catB, n) {
  const out = [], pools = {};
  [catA, catB].forEach(function (c) { pools[c] = []; });
  for (let i = 0; i < n; i++) {
    const c = i % 2 === 0 ? catA : catB;
    if (pools[c].length === 0) pools[c] = shuffle(CONFIG[c].items.slice());
    out.push({ category: c, stimulus: pools[c].pop() });
  }
  return out;
}
// 建立某一個區段的刺激清單，並算出每個刺激的正確按鍵
function buildList(b, n) {
  const s = sides(b.pairing);
  const keyOf = { attr1: "L", attr2: "R" };
  keyOf[s.L] = "L"; keyOf[s.R] = "R";
  let trials = [];
  if (b.type === "concept") trials = shuffle(draw("concept1", "concept2", n));
  if (b.type === "attr") trials = shuffle(draw("attr1", "attr2", n));
  if (b.type === "both") {
    const c = shuffle(draw("concept1", "concept2", n / 2)), a = shuffle(draw("attr1", "attr2", n / 2));
    for (let i = 0; i < n / 2; i++) { trials.push(c[i]); trials.push(a[i]); }   // 概念與屬性輪流出現
  }
  trials.forEach(function (t) { t.key = keyOf[t.category]; });
  return trials;
}
// 產生畫面上方的規則文字
function ruleText(b) {
  const s = sides(b.pairing), L = [], R = [];
  if (b.type !== "attr") { L.push(CONFIG[s.L].label); R.push(CONFIG[s.R].label); }
  if (b.type !== "concept") { L.push(CONFIG.attr1.label); R.push(CONFIG.attr2.label); }
  return { L: L.join(" 或 "), R: R.join(" 或 ") };
}
function brief() {
  const b = BLOCKS[bi], r = ruleText(b);
  $("bTitle").textContent = "第 " + (bi + 1) + " 段，共 7 段";
  $("bText").textContent = "請依照下面的規則，盡快按左邊或右邊。按錯時請改按另一邊。這一段有 " + CONFIG.trials[bi] + " 個字詞。";
  $("bL").textContent = "左邊：" + r.L; $("bR").textContent = "右邊：" + r.R;
  show("brief");
}
function begin() {
  const b = BLOCKS[bi], r = ruleText(b);
  list = buildList(b, CONFIG.trials[bi]); ti = 0;
  $("pL").textContent = "左邊：" + r.L; $("pR").textContent = "右邊：" + r.R;
  show("play"); setTimeout(next, 700);
}
function next() {
  if (ti >= list.length) { bi++; if (bi < BLOCKS.length) brief(); else finish(); return; }
  $("err").textContent = ""; $("stim").textContent = list[ti].stimulus;
  t0 = performance.now(); live = true; firstTry = true;      // 從刺激出現開始計時
}
function answer(side) {
  if (!live) return;
  const t = list[ti], b = BLOCKS[bi];
  if (side !== t.key) { firstTry = false; $("err").textContent = "分類錯誤，請改按另一邊。"; return; }
  // 記錄這一次嘗試：反應時間算到按對為止
  records.push({ block: bi + 1, pairing: b.phase === "single" ? "" : b.pairing, phase: b.phase, trial: ti + 1,
    category: t.category, stimulus: t.stimulus, correct: firstTry ? 1 : 0, rt_ms: Math.round(performance.now() - t0) });
  live = false; ti++; $("stim").textContent = "＋"; setTimeout(next, 250);
}
// 把資料轉成 CSV 文字，方便在還沒接上試算表時檢查
function toCSV() {
  const head = "participant_id,order,block,pairing,phase,trial,category,stimulus,correct,rt_ms";
  const rows = records.map(function (r) { return [pid, order, r.block, r.pairing, r.phase, r.trial, r.category, r.stimulus, r.correct, r.rt_ms].join(","); });
  return head + "\n" + rows.join("\n");
}
function finish() {
  show("done");
  if (CONFIG.endpoint === "") {
    $("doneText").textContent = "目前沒有設定資料接收網址，所以資料顯示在下面，供研究者檢查。";
    $("csv").hidden = false; $("csv").value = toCSV(); return;
  }
  $("doneText").textContent = "資料傳送中，請稍候。";
  // 把資料送到 Apps Script。用 text/plain 與 no-cors，瀏覽器才不會擋下這個跨網站的請求。
  fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ id: pid, order: order, trials: records }) })
    .then(function () { $("doneText").textContent = "資料已經送出，可以關閉這個頁面。你的代碼是 " + pid + "。"; })
    .catch(function () { $("doneText").textContent = "資料沒有送出。請把下面的內容複製給研究者。"; $("csv").hidden = false; $("csv").value = toCSV(); });
}
$("title").textContent = CONFIG.title; $("consentText").textContent = CONFIG.consentText;
$("agree").addEventListener("click", function () {
  pid = $("pid").value.trim() || "P" + Date.now().toString(36) + Math.floor(Math.random() * 1000);   // 沒有代碼時，自動產生一個
  brief();
});
$("bGo").addEventListener("click", begin);
$("btnL").addEventListener("click", function () { answer("L"); });
$("btnR").addEventListener("click", function () { answer("R"); });
document.addEventListener("keydown", function (e) { const k = (e.key || "").toLowerCase(); if (k === "e") answer("L"); if (k === "i") answer("R"); });
</script>
</body>
</html>
